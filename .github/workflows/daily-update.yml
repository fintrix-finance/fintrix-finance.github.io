name: Update Market Watch and Daily Brief

on:
  schedule:
    # 03:17 UTC = 08:47 IST, every day
    - cron: '17 3 * * *'
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write # so the bot can commit the new data.json

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Download the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ask Gemini for today's content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_data.py
        # If this step fails (API down, rate limit, bad answer), the job stops
        # here and nothing is committed - the site keeps yesterday's content.

      - name: Save the new data.json back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data.json; then
            echo "Content unchanged, nothing to commit."
          else
            git add data.json
            git commit -m "Daily market update ($(date -u +'%Y-%m-%d'))"
            git push
          fi
