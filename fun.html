const HISTORY = 140, FUTURE = 20, ROUNDS = 5, CAP = 15;

let phase = 'intro', rounds = [], roundIdx = 0, played = [], choice = null;
let progress = 0, resultReady = false;

function pickRounds(){
  const used = new Set(); const out = [];
  while(out.length < ROUNDS){
    let si = Math.floor(Math.random()*STOCKS.length), g = 0;
    while(used.has(si) && g < 50){ si = Math.floor(Math.random()*STOCKS.length); g++; }
    used.add(si);
    const n = STOCKS[si].px.length;
    const cut = HISTORY + Math.floor(Math.random()*(n - HISTORY - FUTURE - 1));
    out.push({stockIdx: si, cut});
  }
  return out;
}

  if(p>=10) return 'Read it like a pro.';
  if(p>=4) return 'Clean call.';
  if(p>0) return 'Scraped a win.';
  if(p===0) return 'Flat as a chapati.';

  ctx.clearRect(0,0,w,h);
  const pal = dark()
    ? {grid:'#4a3b28', hist:'#e8dcc6', ink:'#f0e7d7', up:'#7fae56', dn:'#d9763d'}
    : {grid:'#d9cbb2', hist:'#4a2e1a', ink:'#26190f', up:'#4c7a2e', dn:'#b3402a'};
  ctx.strokeStyle = pal.grid; ctx.lineWidth = 1;
  [0.25,0.5,0.75].forEach(f=>{ ctx.beginPath(); ctx.moveTo(padL, padT+f*ih); ctx.lineTo(w-padR, padT+f*ih); ctx.stroke(); });
  ctx.strokeStyle = pal.hist; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.beginPath();
  hist.forEach((v,i)=>{ const px=x(i), py=y(v); if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); });
  ctx.stroke();
  const cutPrice = stock.px[cut], endPrice = stock.px[cut+FUTURE];
  const up = endPrice >= cutPrice;
  if(progress > 0){
    const k = progress*FUTURE, full = Math.floor(k);
    ctx.strokeStyle = up ? pal.up : pal.dn; ctx.lineWidth = 2.5; ctx.beginPath();
    ctx.moveTo(x(HISTORY), y(cutPrice));
    for(let i=1;i<=full;i++) ctx.lineTo(x(HISTORY+i), y(fut[i]));
    if(full < FUTURE && k > full){
      const f = k-full; const v = fut[full] + (fut[full+1]-fut[full])*f;
      ctx.lineTo(x(HISTORY+k), y(v));
    }
    ctx.stroke();
  }
  ctx.strokeStyle = pal.ink; ctx.lineWidth = 1.5; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(x(HISTORY), padT-4); ctx.lineTo(x(HISTORY), h-padB); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = pal.ink; ctx.beginPath(); ctx.arc(x(HISTORY), y(cutPrice), 4, 0, Math.PI*2); ctx.fill();
  if(progress < 1){
    ctx.font = '600 10px Inter, system-ui, sans-serif'; ctx.textAlign = 'right';
    ctx.fillText('YOU ARE HERE', x(HISTORY)-8, padT-10);
  }
}

function mast(){
  const t = total();
  const scoreCls = t>0 ? 'up' : t<0 ? 'down' : '';
  const bar = phase==='intro' ? '' :
    '<div class="scorebar"><span>Round '+Math.min(roundIdx+1,ROUNDS)+' of '+ROUNDS+'</span>'+
    '<span class="score '+scoreCls+'">Score '+(t>0?'+':'')+t+'</span></div>';
  return '<div class="mast"><div class="kicker">Fintrix Fun Zone</div><h1 class="title">Beat the Market</h1>'+bar+'</div>';
}

function render(){
  const app = document.getElementById('app');
  if(phase==='intro'){
    app.innerHTML = mast() +
      '<p class="lede">A real chart from the last five years. We hide the name and the dates. You call the next month.</p>'+
      '<div class="rules">'+
      '<div class="rule"><span class="rulenum">1</span><span>Study the mystery chart. It is real, prices and all.</span></div>'+
      '<div class="rule"><span class="rulenum">2</span><span>Call it: buy if you think it rises, sell if you think it falls.</span></div>'+
      '<div class="rule"><span class="rulenum">3</span><span>We reveal what actually happened. Points follow your call.</span></div></div>'+
      '<button class="btn btn-primary" id="startBtn">Start: '+ROUNDS+' rounds</button>'+
      '<p class="fine">Real historical prices via Yahoo Finance, spot-checked against official BSE closes. Just for fun, not investment advice.</p>';
    document.getElementById('startBtn').onclick = startGame;
    return;
  }
  const round = rounds[roundIdx]; const stock = STOCKS[round.stockIdx];
  const spanLabel = stock.sym==='BTC' ? '20 days' : '20 trading days';
  let body = mast() + '<div class="mystery">Mystery chart '+(roundIdx+1)+'</div><div class="chartwrap"><canvas id="chart"></canvas></div>';
  if(phase==='call'){
    body += '<p class="prompt">Your call: what does it do over the next '+spanLabel+'?</p>'+
      '<div class="actions">'+
      '<button class="btn btn-buy" id="buyBtn">Buy<span class="btn-sub">I think it rises</span></button>'+
      '<button class="btn btn-sell" id="sellBtn">Sell<span class="btn-sub">I think it falls</span></button></div>';
  } else if(phase==='reveal' && !resultReady){
    body += '<p class="prompt">Revealing what happened next...</p>';
  } else if(phase==='reveal' && resultReady){
    const last = played[played.length-1];
    const cls = last.pts>0 ? 'win' : last.pts<0 ? 'loss' : '';
    body += '<div class="result '+cls+'">'+
      '<div class="reveal-name">It was '+esc(stock.name)+'</div>'+
      '<div class="reveal-dates">'+fmtDate(stock.d0, stock.days[round.cut])+' to '+fmtDate(stock.d0, stock.days[round.cut+FUTURE])+'</div>'+
      '<div class="reveal-pct '+(last.pct>=0?'up':'down')+'">'+(last.pct>=0?'+':'')+last.pct.toFixed(1)+'% <span class="reveal-span">over the '+spanLabel+'</span></div>'+
      '<div class="reveal-line">'+verdict(last.pts)+'</div>'+
      '<div class="reveal-pts">Your call: '+(last.dir==='buy'?'Buy':'Sell')+' &middot; '+(last.pts>0?'+':'')+last.pts+' pts</div>'+
      '<button class="btn btn-primary" id="nextBtn">'+(roundIdx+1<ROUNDS?'Next round':'See final score')+'</button></div>';
  }
  if(phase==='final'){
    const t = total();
    body = mast() + '<div><div class="final-num">'+(t>0?'+':'')+t+'</div><div class="final-rank">'+rank(t)+'</div>'+
      '<div class="recap">' + played.map((p,i)=>{
        const s = STOCKS[p.stockIdx];
        return '<div class="recap-row"><span class="recap-name">'+(i+1)+'. '+esc(s.name)+'</span>'+
          '<span class="recap-dir">'+(p.dir==='buy'?'Buy':'Sell')+'</span>'+
          '<span class="'+(p.pct>=0?'up':'down')+'">'+(p.pct>=0?'+':'')+p.pct.toFixed(1)+'%</span>'+
          '<span class="recap-pts '+(p.pts>0?'up':p.pts<0?'down':'')+'">'+(p.pts>0?'+':'')+p.pts+'</span></div>';
      }).join('') + '</div>'+
      '<button class="btn btn-primary" id="againBtn">Play again</button>'+
      '<p class="fine">Every round is a real chart from the last five years, drawn from daily closing prices via Yahoo Finance (spot-checked against official BSE closes). Hindsight is not a strategy: just for fun, not investment advice.</p></div>';
  }
  app.innerHTML = body;
  drawChart();
  if(phase==='call'){
    document.getElementById('buyBtn').onclick = ()=>choose('buy');
    document.getElementById('sellBtn').onclick = ()=>choose('sell');
  }
  if(phase==='reveal' && resultReady){ document.getElementById('nextBtn').onclick = next; }
  if(phase==='final'){ document.getElementById('againBtn').onclick = startGame; }
}

function startGame(){
  rounds = pickRounds(); roundIdx = 0; played = []; choice = null; progress = 0; resultReady = false;
  phase = 'call'; render();
}
function choose(dir){
  if(phase!=='call') return;
  const round = rounds[roundIdx]; const stock = STOCKS[round.stockIdx];
  const cutPrice = stock.px[round.cut], endPrice = stock.px[round.cut+FUTURE];
  const pct = ((endPrice-cutPrice)/cutPrice)*100;
  const signed = dir==='buy' ? pct : -pct;
  const pts = Math.max(-CAP, Math.min(CAP, Math.round(signed)));
  choice = dir; played.push({...round, dir, pct, pts});
  progress = 0.0001; resultReady = false; phase = 'reveal'; render();
  const t0 = performance.now(), dur = 1500;
  function step(t){
    const p = Math.min(1, (t-t0)/dur);
    progress = p; drawChart();
    if(p<1) requestAnimationFrame(step);
    else setTimeout(()=>{ resultReady = true; render(); }, 350);
  }
  requestAnimationFrame(step);
}
function next(){
  choice = null; progress = 0; resultReady = false;
  if(roundIdx+1 < ROUNDS){ roundIdx++; phase = 'call'; } else { phase = 'final'; }
  render();
}
window.addEventListener('resize', ()=>{ if(phase==='call'||phase==='reveal') drawChart(); });
render();
</script>
</body>
</html>
