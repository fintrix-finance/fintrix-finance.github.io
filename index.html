<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FINTRIX — Finnexus, The Commerce Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper: #ddd2c1;
  --brown: #4a2e1a;
  --orange: #c1541f;
  --green: #4c7a2e;
  --ink: #2f1e10;
  --border: rgba(74,46,26,0.32);
  --border-soft: rgba(74,46,26,0.16);
  --cream: #ede5d6;
  --sp-1: 6px; --sp-2: 10px; --sp-3: 16px; --sp-4: 22px; --sp-5: 30px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background: #26190f;
  background-image: radial-gradient(circle at 25% 15%, rgba(255,255,255,0.035), transparent 45%),
                     radial-gradient(circle at 80% 85%, rgba(0,0,0,0.3), transparent 55%);
  font-family:'Inter',sans-serif;
  color: var(--ink);
  height:100dvh;
  overflow:hidden;
  display:flex; flex-direction:column; align-items:center;
}
h1,h2,h3,.display{ font-family:'Oswald',sans-serif; font-weight:700; letter-spacing:0.005em; line-height:1.04; color:var(--brown); text-transform:uppercase; }
.serif{ font-family:'PT Serif', serif; }
.kicker{ font-family:'Inter',sans-serif; font-weight:700; font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; }

/* ---------- Shell ---------- */
.app{ width:100%; max-width:620px; height:100dvh; padding:0; display:flex; flex-direction:column; align-items:stretch; position:relative; }
.stage{ position:relative; width:100%; flex:1; min-height:0; perspective: 2600px; }
.edge-tap{ position:absolute; top:0; bottom:0; width:14%; background:transparent; border:none; cursor:pointer; z-index:20; padding:0; }
.edge-tap:disabled{ cursor:default; pointer-events:none; }
.edge-tap.left{ left:0; }
.edge-tap.right{ right:0; }
.leaf{
  position:absolute; inset:0; background:var(--paper);
  border:1px solid rgba(0,0,0,0.14);
  box-shadow: 0 32px 64px -22px rgba(0,0,0,0.55), 0 12px 22px -10px rgba(0,0,0,0.35);
  border-radius:2px; overflow:hidden;
  transform-style:preserve-3d; transform-origin:left center;
  transition: transform 0.34s cubic-bezier(.45,.02,.55,1), box-shadow 0.34s ease;
  backface-visibility:hidden;
}
.leaf::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background: linear-gradient(102deg, transparent 25%, rgba(255,255,255,0.22) 48%, transparent 66%);
  opacity:0; transition: opacity 0.32s ease;
}
.leaf.flip-mid::after{ opacity:1; }
.leaf.flip-mid{
  transform: rotateY(-92deg) translateZ(46px);
  box-shadow: 0 60px 120px -12px rgba(0,0,0,0.7), 0 24px 46px -12px rgba(0,0,0,0.55);
}
.leaf.gone-left{ transform: rotateY(-165deg) translateZ(0); box-shadow:none; }

/* ---------- Page frame ---------- */
.page{ position:absolute; inset:0; display:flex; flex-direction:column; background:var(--paper); }
.page-inner{ flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; padding: 28px 26px 0; overflow-y:auto; }
.page-header{
  display:flex; justify-content:space-between; align-items:baseline; gap:8px;
  padding-bottom: 12px; border-bottom: 2px solid var(--brown); margin-bottom: 20px; flex-shrink:0;
}
.page-header .brand{ font-family:'Oswald',sans-serif; font-weight:700; font-size:14px; letter-spacing:0.04em; color:var(--brown); }
.page-header .section-name{ font-weight:700; font-size:9.5px; letter-spacing:0.16em; color:var(--orange); text-transform:uppercase; }
.page-header .page-num{ font-weight:600; font-size:11px; color:var(--brown); font-family:'Inter',sans-serif; white-space:nowrap; }
.page-footer{ flex-shrink:0; padding: 12px 26px 20px; border-top:1px solid var(--border); text-align:center; font-weight:600; font-size:9px; letter-spacing:0.14em; color:var(--brown); }

/* ---------- Reusable box ---------- */
.box{ border:1px solid var(--brown); display:flex; flex-direction:column; background: rgba(255,255,255,0.08); }
.box-label{ background:var(--brown); color:var(--cream); font-weight:600; font-size:10px; letter-spacing:0.06em; text-transform:uppercase; padding:7px 12px; flex-shrink:0; }
.box-label.orange{ background:var(--orange); }
.box-label.green{ background:var(--green); }
.box-fill{ flex:1; padding:10px 12px; display:flex; align-items:center; justify-content:center; text-align:center; color:rgba(74,46,26,0.42); font-family:'PT Serif',serif; font-style:italic; font-size:10.5px; line-height:1.35; }
.box-cta{ padding:8px 12px; font-weight:600; font-size:10px; color:var(--brown); border-top:1px solid var(--border-soft); flex-shrink:0; cursor:pointer; transition:background 0.15s; position:relative; z-index:25; }
.box-cta:hover{ background:rgba(74,46,26,0.06); }
.box-cta:active{ background:rgba(74,46,26,0.12); }

/* ---------- Cover ---------- */
.cover-top{ text-align:center; margin-bottom:12px; flex-shrink:0; }
.cover-issue-row{ display:flex; justify-content:space-between; font-weight:600; font-size:9.5px; letter-spacing:0.1em; color:var(--orange); margin-bottom:6px; }
.cover-tagline{ font-weight:600; font-size:10px; letter-spacing:0.16em; color:var(--brown); margin-bottom:2px; }
.masthead{ font-family:'Oswald',sans-serif; font-weight:700; font-size:clamp(36px,9vw,50px); color:var(--brown); letter-spacing:0.01em; line-height:1; }
.cover-rule{ height:2px; background:var(--brown); margin-bottom:12px; flex-shrink:0; }

.cover-columns{ display:grid; grid-template-columns: 2.15fr 1fr; gap:16px; padding-bottom:14px; }
.cover-left{ display:flex; flex-direction:column; gap:10px; }
.cover-left > .box:first-child{ min-height:108px; }
.row-split{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.row-split .box{ min-height:78px; }
.cover-left > .box:last-of-type{ min-height:56px; }
.cover-right{ display:flex; flex-direction:column; gap:12px; border-left:1px solid var(--border); padding-left:14px; }
.inbrief-label{ font-weight:700; font-size:9.5px; letter-spacing:0.14em; color:var(--orange); text-transform:uppercase; }
.inbrief-list{ display:flex; flex-direction:column; gap:9px; }
.inbrief-item:last-child{ border-bottom:none; padding-bottom:0; }
.inbrief-num{ font-family:'Oswald',sans-serif; font-weight:700; font-size:20px; color:var(--ink); line-height:1; margin-bottom:3px; }
.inbrief-label-txt{ font-family:'PT Serif',serif; font-style:italic; font-size:10px; color:var(--ink); line-height:1.3; margin-bottom:4px; }
.inbrief-item{ padding-bottom:8px; border-bottom:1px solid var(--border-soft); cursor:pointer; transition:opacity 0.15s; position:relative; z-index:25; }
.inbrief-item:hover{ opacity:0.7; }
.inbrief-arrow{ font-weight:600; font-size:9px; color:var(--orange); }
.explains-box{ background:var(--brown); color:var(--cream); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:14px; text-align:center; min-height:90px; flex:1; cursor:pointer; transition:filter 0.15s; position:relative; z-index:25; }
.explains-box:hover{ filter:brightness(1.15); }
.explains-box .bulb{ font-size:18px; }
.explains-box .label{ font-weight:700; font-size:10px; letter-spacing:0.08em; }
.story-cta-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--cream); border:1px solid var(--border); padding:10px 14px; flex-shrink:0; }
.story-cta-row .txt strong{ display:block; font-family:'Inter',sans-serif; font-weight:600; font-size:11px; margin-bottom:2px; }
.story-cta-row .txt span{ font-size:10px; color:rgba(51,32,16,0.68); line-height:1.35; }
.qr-tag{ font-size:8px; font-weight:700; text-align:center; color:var(--brown); border:1px solid var(--brown); padding:6px 8px; white-space:nowrap; flex-shrink:0; text-decoration:none; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; transition:background 0.15s; position:relative; z-index:25; }
.qr-tag:hover{ background:rgba(74,46,26,0.06); }
.qr-tag img{ width:52px; height:52px; display:block; }

/* ---------- Article pages ---------- */
.headline{ font-size:clamp(26px,6.4vw,38px); margin-bottom:10px; }
.subhead{ font-family:'Inter',sans-serif; font-weight:600; font-size:10.5px; letter-spacing:0.05em; color:var(--brown); padding-bottom:12px; border-bottom:2px solid var(--orange); margin-bottom:14px; max-width:92%; }
.body-copy{ font-family:'PT Serif',serif; font-size:13px; line-height:1.7; color:var(--ink); }
.body-copy p{ margin-bottom:10px; }
.placeholder-copy p{ color:rgba(51,32,16,0.42); font-style:italic; }
.pullbox{ background:var(--brown); color:var(--cream); padding:16px 20px; margin-top:16px; width:62%; align-self:flex-end; flex-shrink:0; margin-bottom:16px; }
.pullbox h3{ color:var(--cream); font-size:18px; margin-bottom:10px; }
.pullbox p{ font-family:'Inter',sans-serif; font-size:11px; line-height:1.55; opacity:0.85; }

/* ---------- Market Watch ---------- */
.mw-head{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:18px; gap:10px; flex-shrink:0; flex-wrap:wrap; }
.mw-head h1{ font-size:clamp(24px,5.4vw,32px); margin-bottom:6px; }
.mw-head .sub{ font-family:'Inter',sans-serif; font-weight:600; font-size:10px; letter-spacing:0.06em; color:var(--brown); text-transform:uppercase; }
.mw-head .right{ text-align:right; flex-shrink:0; }
.mw-head .right .date{ font-weight:700; color:var(--orange); font-size:12px; }
.mw-head .right .week{ font-size:9.5px; color:var(--brown); font-family:'Inter',sans-serif; }
.mw-body{ display:flex; flex-direction:column; gap:14px; padding-bottom:20px; }
.mw-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.mw-row .box{ min-height:96px; }
.mw-bottom-row{ display:grid; grid-template-columns:1.5fr 1fr; gap:14px; }
.mw-lw{ display:flex; flex-direction:column; gap:10px; }
.mw-bottom-row .box{ min-height:170px; }
.stat-line{ display:flex; justify-content:space-between; padding:8px 12px; font-family:'Inter',sans-serif; font-size:10.5px; border-bottom:1px solid var(--border-soft); }
.stat-line .val{ font-weight:700; }
.stat-line .up{ color:var(--green); }
.stat-line .down{ color:var(--orange); }
.snapshot-strip{ border:1px solid var(--brown); min-height:48px; display:flex; align-items:center; justify-content:center; color:rgba(74,46,26,0.4); font-family:'PT Serif',serif; font-style:italic; font-size:10px; padding:10px; text-align:center; }

/* ---------- Economy / Geopolitics ---------- */
.story-block{ margin-bottom:26px; flex-shrink:0; }
.story-block .kicker{ color:var(--orange); display:block; margin-bottom:8px; }
.story-block h2{ font-size:clamp(19px,4vw,25px); margin-bottom:10px; }
.story-block.right-align{ text-align:right; margin-left:auto; max-width:80%; }
.geo-boxed{ background:var(--orange); color:#fff; padding:20px 22px; margin-top:auto; margin-bottom:20px; flex-shrink:0; }
.geo-boxed h3{ color:#fff; font-size:17px; margin-bottom:10px; }
.geo-boxed p{ font-family:'Inter',sans-serif; font-size:10.5px; opacity:0.92; line-height:1.55; }

/* ---------- Explains & Venture ---------- */
.split-page{ display:flex; flex-direction:column; flex:1; min-height:0; gap:26px; padding-bottom:20px; }
.split-page .block{ flex:1; min-height:0; }
.split-page .block.right{ text-align:right; }
.split-page .block.right .body-copy{ text-align:right; }

/* ---------- Credits ---------- */
.credits-title{ text-align:center; margin: 10px 0 30px; flex-shrink:0; }
.credits-title h1{ font-size:clamp(26px,5.6vw,34px); }
.credits-rule{ width:60px; height:3px; background:var(--orange); margin:12px auto 0; }
.author-grid{ display:grid; grid-template-columns:1fr 1fr; gap:30px 20px; padding-bottom:20px; }
.author-grid .author-card:last-child:nth-child(odd){ grid-column: 1 / -1; }
.author-card{ text-align:center; }
.author-avatar{ width:76px; height:76px; border-radius:50%; border:2px solid var(--brown); margin:0 auto 10px; background:var(--cream); overflow:hidden; }
.author-avatar img{ width:100%; height:100%; object-fit:cover; display:block; filter: grayscale(28%) sepia(8%); }
.author-card .name{ font-family:'Inter',sans-serif; font-weight:600; font-size:11px; color:var(--brown); margin-bottom:3px; }
.author-card .role{ font-size:10px; color:rgba(51,32,16,0.6); font-style:italic; font-family:'PT Serif',serif; }

/* ---------- Edge navigation (invisible tap zones) ---------- */

.spread{ display:flex; width:100%; height:100%; }
.spread .page{ flex:1; min-width:0; position:static; }
.spread .spine{ width:16px; flex-shrink:0; background: linear-gradient(90deg, rgba(0,0,0,0.14), rgba(0,0,0,0.03) 35%, rgba(0,0,0,0.03) 65%, rgba(0,0,0,0.14)); }
.leaf.is-spread{ background:transparent; border:none; box-shadow:none; }
.leaf.is-spread .page{ background:var(--paper); border:1px solid rgba(0,0,0,0.14); box-shadow: 0 20px 44px -18px rgba(0,0,0,0.4); border-radius:2px; }

@media (min-width:700px){
  .app{ max-width:1100px; justify-content:center; }
  .stage{ flex:none; margin:0 auto; }
  .edge-tap{ width:10%; }
}
@media (max-width:420px){
  .cover-columns{ grid-template-columns: 2fr 1fr; gap:14px; }
  .cover-right{ padding-left:12px; }
  .inbrief-num{ font-size:22px; }
}
</style>
</head>

const stage = document.getElementById('stage');
let current = 0;
let leaves = [];
let spreads = [];

function isDesktop(){ return window.innerWidth >= 700; }

function computeSpreads(){
  if(isDesktop()){
    const s = [[0]];
    for(let i = 1; i < PAGES_HTML.length; i += 2){
      if(i + 1 < PAGES_HTML.length) s.push([i, i+1]);
      else s.push([i]);
    }
    return s;
  }
  return PAGES_HTML.map((_, i) => [i]);
}

function applyStageShape(){
  const spread = spreads[current];
  const isSpread = !!spread && spread.length === 2;
  stage.classList.toggle('stage-spread', isSpread);
  stage.classList.toggle('stage-single', !isSpread);
  fitStage(isSpread);
}

function fitStage(isSpread){
  if(!isDesktop()){ stage.style.width = ''; stage.style.height = ''; return; }
  const ratio = isSpread ? (1888/1305) : (924/1305);
  const appEl = document.querySelector('.app');
  const containerW = appEl.clientWidth;
  const containerH = window.innerHeight * 0.94;
  let width = Math.min(containerW, containerH * ratio);
  let height = width / ratio;
  stage.style.width = width + 'px';
  stage.style.height = height + 'px';
}

function renderStage(preserveFirstPageIndex){
  const firstPageBefore = preserveFirstPageIndex != null ? preserveFirstPageIndex : (spreads[current] ? spreads[current][0] : 0);
  stage.innerHTML = '';
  spreads = computeSpreads();

  spreads.forEach((idxs, i) => {
    const leaf = document.createElement('div');
    leaf.className = 'leaf';
    leaf.style.zIndex = spreads.length - i;
    if(idxs.length === 2){
      const wrap = document.createElement('div');
      wrap.className = 'spread';
      const pageL = document.createElement('div');
      pageL.className = 'page';
      pageL.innerHTML = PAGES_HTML[idxs[0]];
      const spine = document.createElement('div');
      spine.className = 'spine';
      const pageR = document.createElement('div');
      pageR.className = 'page';
      pageR.innerHTML = PAGES_HTML[idxs[1]];
      wrap.appendChild(pageL); wrap.appendChild(spine); wrap.appendChild(pageR);
      leaf.appendChild(wrap);
      leaf.classList.add('is-spread');
    } else {
      const page = document.createElement('div');
      page.className = 'page';
      page.innerHTML = PAGES_HTML[idxs[0]];
      leaf.appendChild(page);
    }
    stage.appendChild(leaf);
  });

  leaves = Array.from(document.querySelectorAll('.leaf'));
  current = spreads.findIndex(idxs => idxs.includes(firstPageBefore));
  if(current === -1) current = 0;
  leaves.forEach((l,i) => l.classList.toggle('gone-left', i < current));
  applyStageShape();
  updateControls();
  if(FINTRIX_DATA) applyDynamic(FINTRIX_DATA);
}


// ---------- Daily content (Market Watch & Daily Brief) ----------
// These sections are refreshed daily from data.json by an automated updater
// (see generate_data.py and .github/workflows/daily-update.yml).
// If data.json is missing, unreachable, or a field is absent, the page
// keeps showing the content built into this file - nothing breaks.
let FINTRIX_DATA = null;

function dynText(id, txt){
  const el = document.getElementById(id);
  if(el && typeof txt === 'string' && txt.trim()) el.textContent = txt;
}

function dynStat(id, item){
  const el = document.getElementById(id);
  if(!el || !item || typeof item.value !== 'string' || !item.value.trim()) return;
  el.className = 'val' + (item.dir === 'up' ? ' up' : item.dir === 'down' ? ' down' : '');
  el.textContent = item.value;
}

function dynList(prefix, arr){
  if(!Array.isArray(arr)) return;
  arr.slice(0, 3).forEach((v, i) => dynText(prefix + i, v));
}

function applyDynamic(d){
  if(!d || typeof d !== 'object') return;

  const c = d.cover || {};
  dynText('dyn-cover-mw', c.market_watch_teaser);
  dynText('dyn-cover-db', c.daily_brief_teaser);
  dynText('dyn-cover-ib2', c.inbrief_2);
  dynText('dyn-cover-ib3', c.inbrief_3);

  const mw = d.market_watch || {};
  dynText('dyn-mw-date', mw.date_label);
  dynText('dyn-mw-close', mw.close_label);
  const groups = {indian: 'dyn-mw-in-', asian: 'dyn-mw-as-', european: 'dyn-mw-eu-', global: 'dyn-mw-gl-'};
  Object.keys(groups).forEach(key => {
    const rows = mw[key];
    if(!Array.isArray(rows)) return;
    rows.slice(0, 3).forEach((row, i) => dynStat(groups[key] + i, row));
  });
  dynList('dyn-mw-loser-', mw.losers);
  dynList('dyn-mw-winner-', mw.winners);
  dynText('dyn-mw-strip', mw.snapshot_strip);

  const ipo = document.getElementById('dyn-mw-ipo');
  if(ipo && Array.isArray(mw.ipo_desk) && mw.ipo_desk.length){
    ipo.innerHTML = '';
    mw.ipo_desk.forEach((item, i) => {
      if(!item) return;
      const strong = document.createElement('strong');
      strong.textContent = item.name || '';
      ipo.appendChild(strong);
      ipo.appendChild(document.createTextNode(' \u2014 ' + (item.note || '')));
      if(i < mw.ipo_desk.length - 1) ipo.appendChild(document.createElement('br'));
    });
  }

  const db = d.daily_brief || {};
  [['story_1', 'dyn-ec1-'], ['story_2', 'dyn-ec2-']].forEach(([key, pfx]) => {
    const s = db[key];
    if(!s || typeof s !== 'object') return;
    dynText(pfx + 'kicker', s.kicker);
    dynText(pfx + 'head', s.headline);
    const body = document.getElementById(pfx + 'body');
    if(body && Array.isArray(s.paragraphs) && s.paragraphs.length){
      body.innerHTML = '';
      s.paragraphs.forEach(p => {
        const el = document.createElement('p');
        el.textContent = String(p);
        body.appendChild(el);
      });
    }
  });
}

fetch('data.json', {cache: 'no-store'})
  .then(r => r.ok ? r.json() : null)
  .then(d => { if(d){ FINTRIX_DATA = d; applyDynamic(d); } })
  .catch(() => { /* no data.json or bad JSON: keep the built-in content */ });

renderStage(0);

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const firstPage = spreads[current] ? spreads[current][0] : 0;
    const wasDesktop = stage.dataset.wasDesktop === '1';
    if(isDesktop() !== wasDesktop){
      renderStage(firstPage);
    } else {
      applyStageShape();
    }
    stage.dataset.wasDesktop = isDesktop() ? '1' : '0';
  }, 150);

const authorGrid = document.getElementById('authorGrid');
[
  { name: 'Mahleen Kaur', role: 'Market Desk', photo: AVATARS.mahleen },
  { name: 'Mahi Arora', role: 'Design', photo: AVATARS.mahi },
  { name: 'Khushi Dogra', role: 'Collaborator', photo: AVATARS.khushi },
  { name: 'Charvi Verma', role: 'Editor', photo: AVATARS.charvi },
  { name: 'Jasmine', role: 'Economy Desk', photo: AVATARS.jasmine }
].forEach(({name, role, photo}) => {
  const c = document.createElement('div');
  c.className = 'author-card';
  c.innerHTML = `<div class="author-avatar"><img src="${photo}" alt="${name}"></div><div class="name">${name}</div><div class="role">${role}</div>`;
  authorGrid.appendChild(c);
});

function updateControls(){
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').disabled = current===leaves.length-1;
}

function jumpToPage(pageIdx){
  const spreadIdx = spreads.findIndex(s => s.includes(pageIdx));
  if(spreadIdx !== -1) goTo(spreadIdx);
}

function goTo(target){
  if(target===current || target<0 || target>leaves.length-1) return;
  const changed = [];
  leaves.forEach((l,i) => {
    const shouldBeGone = i < target;
    const isGone = l.classList.contains('gone-left');
    if(shouldBeGone !== isGone) changed.push(l);
  });
  changed.forEach(l => l.classList.add('flip-mid'));
  setTimeout(() => {
    changed.forEach((l,idx) => {
      const i = leaves.indexOf(l);
      l.classList.remove('flip-mid');
      l.classList.toggle('gone-left', i < target);
    });
  }, 300);
  current = target;
  applyStageShape();
  updateControls();
}

document.getElementById('prevBtn').addEventListener('click', () => goTo(current-1));
document.getElementById('nextBtn').addEventListener('click', () => goTo(current+1));
document.addEventListener('keydown', e => {
  if(e.key==='ArrowRight') goTo(current+1);
  if(e.key==='ArrowLeft') goTo(current-1);
});

let touchStartX = null;
stage.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive:true});
stage.addEventListener('touchend', e => {
  if(touchStartX===null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 45){ dx<0 ? goTo(current+1) : goTo(current-1); }
  touchStartX = null;
}, {passive:true});

updateControls();
</script>
</body>
</html>
